mutation SaveActivityReplyMutation($id: Int, $text: String) {
    SaveActivityReply(id: $id, text: $text) {
        ...ReplyFragment
    }
}

fragment ReplyFragment on ActivityReply {
    id
    createdAt
    isLiked
    likeCount
    text
    userId
    user {
        name
        avatar {
            medium
        }
    }
}