mutation SaveMessageActivityMutation($id: Int, $message: String, $recipientId: Int, $private: Boolean, $locked: Boolean = false) {
    SaveMessageActivity(id: $id, message: $message, recipientId: $recipientId, private: $private, locked: $locked) {
        ...MessageActivityFragment
    }
}

fragment MessageActivityFragment on MessageActivity {
    id
    createdAt
    isLiked
    likeCount
    replyCount
    isLocked
    message
    messengerId
    messenger {
        name
        avatar {
            medium
        }
    }
}