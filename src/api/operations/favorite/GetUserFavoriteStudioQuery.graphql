query GetUserFavoriteStudioQuery($userId: Int, $page: Int, $perPage: Int) {
    User(id: $userId) {
        favourites {
            studios(page: $page, perPage: $perPage) {
                nodes {
                    id
                    name
                    isAnimationStudio
                }
                pageInfo {
                    currentPage
                    hasNextPage
                }
            }
        }
    }
}